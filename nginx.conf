server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Proxy nur für die eigene Gitea (Browser-Download ohne CORS). Nur GET.
  # Variable + resolver: nginx startet auch ohne Netz, der Proxy geht dann eben nicht.
  location /gitproxy/ {
    limit_except GET { deny all; }
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $gitea git.jensr.de;
    rewrite ^/gitproxy/(.*)$ /$1 break;
    proxy_pass https://$gitea;
    proxy_ssl_server_name on;
    proxy_set_header Host git.jensr.de;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_max_temp_file_size 0;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
